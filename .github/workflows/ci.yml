# Continuous integration.
#
# ─────────────────────────────────────────────────────────────────────────
# THREE JOBS, BECAUSE TWO OF THEM NEED SOMETHING THIS REPOSITORY DOES NOT
# CONTAIN.
#
# `web` is the front end on its own: lint, unit tests, production build. It
# needs nothing but this repository and runs on every push.
#
# `contracts` is the seam between the web app and the platform — the STATIC
# checks that catch a renamed backend route or a mistyped socket event before
# a page does.
#
# `e2e` is the same seam at RUNTIME: it stands the platform up, runs the live
# contract check, then drives a browser through register → sign in → balance
# → play a round → chat. It is the only job that can see a CORS header that
# refuses the browser or a socket that stays anonymous after sign-in.
#
# Both of the latter read `backend/`, which is a VENDORED TREE THAT IS NOT
# COMMITTED HERE (`git ls-files backend` is empty). On a fresh clone the
# directory simply is not there.
#
# So those jobs detect it and skip with a message rather than failing, and
# rather than passing. A green tick for a check that never ran is the failure
# mode worth designing against: it is how a broken contract ships under a
# clean build. The skip is loud, in the job summary, and the moment the
# backend is available — vendored in, added as a submodule, or checked out
# beside this repo in a self-hosted runner — the job runs with no edit here.
# ─────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. A queue of superseded
# runs on a busy branch is wasted minutes and a stale red tick on a commit
# nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `package.json` declares `>=20.19`; 22 is the active LTS and what
          # the lockfile was resolved against.
          node-version: 22
          cache: npm

      # `ci`, not `install`: it installs exactly what the lockfile pins and
      # fails if `package.json` and `package-lock.json` disagree, which is the
      # difference between a reproducible build and a hopeful one.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Kept for a human to look at when a build regresses in size — the
      # bundle is one chunk today and the report is where that shows.
      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  contracts:
    name: Contracts — routes, socket events, schema
    runs-on: ubuntu-latest
    needs: web

    services:
      # `db:verify` compares the live schema against the migrations. Nothing
      # else in this job needs a database; it is here rather than in a third
      # job because starting one costs seconds and splitting the seam checks
      # across two jobs makes a failure harder to read, not easier.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bitcasino
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: ibitplay
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U bitcasino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is the backend tree present?
        id: backend
        run: |
          if [ -d backend/packages/socket/src ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Seam checks skipped"
              echo
              echo 'No `backend/` in this checkout, so the four checks below did not run:'
              echo
              echo '- `verify:socket-events` — the client event table against the platform’s'
              echo '- `verify:modules` — the platform’s own route table'
              echo '- `verify-frontend-routes` — every path in `lib/endpoints.js` against a mounted route'
              echo '- `db:verify` — the schema against the migrations'
              echo
              echo 'They are **not** passing. See the comment at the top of this workflow.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── From here on, everything is conditional on that answer ──────────

      # Static: it diffs two files. No server, no database.
      - name: Socket event table
        if: steps.backend.outputs.present == 'true'
        run: npm run verify:socket-events

      - name: Install the backend
        if: steps.backend.outputs.present == 'true'
        run: npm --prefix backend ci

      # Also static: it parses the route table rather than calling it.
      - name: Backend route table
        if: steps.backend.outputs.present == 'true'
        run: npm --prefix backend run verify:modules

      # The one that catches a renamed route: every path in
      # `apps/web/src/lib/endpoints.js` must resolve to something the backend
      # actually mounts.
      - name: Frontend endpoint registry
        if: steps.backend.outputs.present == 'true'
        run: node backend/tools/verify-frontend-routes.js

      - name: Database schema
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_NAME: ibitplay
          DB_USER: bitcasino
          DB_PASSWORD: postgres123
          DB_SCHEMA: public
          DB_SSL: 'false'
        run: |
          npm run db:migrate
          npm run db:verify

  # ─────────────────────────────────────────────────────────────────────
  # THE FIXTURE JOB.
  #
  # `verify:api` and the Playwright suite were both absent from this workflow
  # for the same reason, recorded here as "a fixture job, not a step": they
  # need five processes, a migrated database and a seeded catalogue. This is
  # that job. It stands the platform up, runs the live contract check against
  # it, then drives a real browser through register → sign in → balance →
  # play a round → chat.
  #
  # It is the only job here that can catch a CORS header that refuses the
  # browser, a proxy that drops the websocket upgrade, or a socket that stays
  # anonymous after sign-in — each of which renders a correct-looking screen
  # that does nothing.
  #
  # Same skip discipline as `contracts`: no `backend/` means a LOUD skip in
  # the job summary, never a silent pass.
  # ─────────────────────────────────────────────────────────────────────
  e2e:
    name: End to end — the live platform in a browser
    runs-on: ubuntu-latest
    needs: web

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bitcasino
          POSTGRES_PASSWORD: postgres123
          POSTGRES_DB: ibitplay
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U bitcasino"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5433
      DB_NAME: ibitplay
      DB_USER: bitcasino
      DB_PASSWORD: postgres123
      DB_SCHEMA: public
      DB_SSL: 'false'
      # The browser reaches the app on Vite's own port, and Vite proxies
      # `/api` to the gateway and `/socket.io` to user-service. Both origins
      # have to be allowed or every request dies in a preflight.
      CORS_ORIGIN: http://127.0.0.1:5173
      SOCKET_ALLOWED_ORIGINS: http://127.0.0.1:5173
      # The registration limiter is 20/hour per IP and this suite registers on
      # every run. One IP in Actions means the suite would start 429ing after
      # the twentieth run of the day — as a product bug, in the UI.
      RATE_LIMIT_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Is the backend tree present?
        id: backend
        run: |
          if [ -d backend/services/user/src ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            {
              echo "### End-to-end skipped"
              echo
              echo 'No `backend/` in this checkout, so the browser suite did not run:'
              echo
              echo '- `verify:api` — the app’s own query objects against a live gateway'
              echo '- `test:e2e` — register → sign in → balance → play a round → chat'
              echo
              echo 'They are **not** passing. See the comment above this job.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install the backend
        if: steps.backend.outputs.present == 'true'
        run: npm --prefix backend ci

      # Migrate, then seed. `--demo` is what creates `demo_player01` with a
      # funded INR balance and fills `gisgamesnew` from the web app's own
      # `data/catalog.js`; without it the specs would open a game that does
      # not exist, which reads as a broken catalogue page.
      - name: Migrate and seed
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed:demo

      # Four services, not six. No sportsbook here for the same reason there
      # is none anywhere in this project, and `sports-worker` polls a provider
      # that does not exist in CI.
      - name: Start the platform
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: |
          npm run dev user admin casino gateway > "$RUNNER_TEMP/platform.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/platform.pid"

      - name: Wait for the gateway
        if: steps.backend.outputs.present == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4000/api/v1/casino/games/stats > /dev/null; then
              echo "gateway up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the gateway never came up"
          cat "$RUNNER_TEMP/platform.log"
          exit 1

      # The live contract check first: it is faster than the browser suite and
      # its failures are far easier to read. A 422 from a `.strict()` validator
      # reported here is one line; the same defect reported by Playwright is a
      # blank rail and a timeout.
      - name: Live API contract
        if: steps.backend.outputs.present == 'true'
        working-directory: apps/web
        run: npm run verify:api

      - name: Install Chromium
        if: steps.backend.outputs.present == 'true'
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        if: steps.backend.outputs.present == 'true'
        working-directory: apps/web
        run: npm run test:e2e

      - name: The platform's log, when something failed
        if: failure() && steps.backend.outputs.present == 'true'
        run: tail -200 "$RUNNER_TEMP/platform.log"

      - name: Upload the Playwright report
        if: failure() && steps.backend.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────
# STILL NOT HERE, AND NAMED RATHER THAN QUIETLY OMITTED
#
# `backend/npm test` — 1095 tests — wants its own `ibitplay_test` database,
# and this workflow's service container hosts the development one that
# `db:verify` migrates and the `e2e` job seeds. Giving it a second database is
# a small change to this file and a larger one to how the backend's test setup
# picks its connection; it is worth doing and it is not done here.
# ─────────────────────────────────────────────────────────────────────────
